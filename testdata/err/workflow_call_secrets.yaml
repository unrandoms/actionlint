on:
  workflow_call:
    secrets:
      secret0:
        description: 'test'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # OK: secret0 is declared, using it in a command (not echoed)
      - run: curl -u "user:${{ secrets.secret0 }}" https://example.com
      # ERROR: secret1 is not declared in this workflow's secrets block
      - run: curl -u "user:${{ secrets.secret1 }}" https://example.com
